name: CI

# Branching strategy'deki "CI yesil olmadan merge yok" kurali icin: PR'lar
# ve korunan dallara giden pushlar burada derlenip test edilir.
on:
  push:
    branches: [main, develop]
  # Hedef dal filtresi yok: hangi dala acilirsa acilsin her PR'da check
  # gorunsun. Filtre varken main/develop disina acilan bir PR sessizce
  # kontrolsuz kaliyordu - "check yok" ile "check yesil" ayirt edilemiyor.
  pull_request:

# Ayni dala pes pese push atildiginda eski kosu bosuna calismasin.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Iptal sadece PR'lar icin. main/develop'a arka arkaya merge edildiginde
  # onceki merge commit'i "cancelled" check ile kalir; required check
  # acilinca bu, yesil olmasi gereken bir commit'i kirmizi gosterir.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend build + test
    runs-on: ubuntu-latest
    # Testcontainers imaj indirir; varsayilan 360 dk'lik limit, takilan bir
    # kosuyu saatlerce ayakta tutar.
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          # ~/.m2 cache'i: her kosuda bagimliliklarin tamami yeniden inmesin.
          cache: maven

      - name: Build + test
        # verify, package'in aksine testleri de calistirir. Testler gercek bir
        # Postgres'e karsi kosuyor (Testcontainers); ubuntu-latest uzerinde
        # Docker hazir geldigi icin ek kurulum gerekmiyor.
        run: mvn -B --no-transfer-progress verify

      - name: Upload test reports
        # Kirmizi kosuda logdan hangi assertion'in patladigini okumak zor;
        # surefire raporlari indirilebilir kalsin.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # ci, install'un aksine lock dosyasina birebir uyar; CI'da calisan
        # surumler gelistiricinin makinesindekiyle ayni olsun.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # next build tip hatalarinda da patlar, ama hatayi burada gormek
        # build ciktisinin icinde aramaktan daha okunakli.
        run: npm run typecheck

      - name: Build
        run: npm run build

# NOT: Frontend testi (Vitest/Playwright) henuz yok; test ticket'i acildiginda
# bu job'a "npm test" adimi eklenecek.
