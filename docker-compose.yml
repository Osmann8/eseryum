# Local gelistirme ortami: veritabani + backend (+ hazir olunca frontend).
# Kullanim:
#   docker compose up -d postgres        -> sadece DB (backend'i IDE'den calistirirken)
#   docker compose up -d --build         -> DB + backend
#   docker compose --profile frontend up -d --build   -> hepsi
name: eseryum

services:
  postgres:
    image: postgres:16-alpine
    container_name: eseryum-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eseryum}
      POSTGRES_USER: ${POSTGRES_USER:-eseryum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eseryum}
    ports:
      # Host portu disaridan degistirilebilsin: 5432'de baska bir Postgres
      # calisiyorsa .env icinde POSTGRES_PORT yeter.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Backend, DB gercekten sorgu kabul etmeden baslarsa Flyway patlar.
      # "konteyner ayakta" yetmiyor, pg_isready gerekiyor.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eseryum} -d ${POSTGRES_DB:-eseryum}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: eseryum-backend:local
    container_name: eseryum-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # Konteyner icinden DB'ye servis adiyla erisilir; localhost burada
      # backend konteynerinin kendisidir.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eseryum}
      DB_USERNAME: ${POSTGRES_USER:-eseryum}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eseryum}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    # package.json dolana kadar bu servis varsayilan `up` ile baslamaz.
    profiles: ["frontend"]
    build:
      context: ./frontend
    image: eseryum-frontend:local
    container_name: eseryum-frontend
    depends_on:
      - backend
    environment:
      # Tarayicidan gidilen adres: host makinenin gozuyle backend.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
